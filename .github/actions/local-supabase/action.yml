name: Start local Supabase
description: >-
  Starts the throwaway local Supabase stack CI tests against and writes its keys to .env.local.
  Its images come from AWS's public registry (public.ecr.aws), whose anonymous data limit GitHub's
  runners share and hit (#238), so they're kept in the Actions cache per CLI version: loaded before
  `supabase start` on a hit, saved after it on a miss.

runs:
  using: composite
  steps:
    # The same CLI version as deploy-production.yml, so migrations are tested with the tool that ships them.
    - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
      with:
        version: 2.117.0

    # Keyed on the CLI version, which decides which images it pulls. The db and web jobs share it.
    - name: Restore Supabase images
      id: images
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /tmp/supabase-images.tar.zst
        key: supabase-images-2.117.0-${{ runner.os }}

    - name: Load Supabase images
      if: steps.images.outputs.cache-hit == 'true'
      shell: bash
      run: zstd -dc /tmp/supabase-images.tar.zst | docker load

    # Only what the tests use: Postgres, Auth, the REST and Storage APIs, Realtime, Kong and
    # postgres-meta (tests/db/pg-query.ts).
    - name: Start local Supabase
      shell: bash
      run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit

    - name: Pack Supabase images
      if: steps.images.outputs.cache-hit != 'true'
      shell: bash
      run: |
        docker images --format '{{.Repository}}:{{.Tag}}' | grep '^public.ecr.aws/supabase/' |
          xargs docker save | zstd -T0 -3 -q -o /tmp/supabase-images.tar.zst
        ls -lh /tmp/supabase-images.tar.zst

    # Both jobs may miss at once; the second save finds the key taken and only warns.
    - name: Save Supabase images
      if: steps.images.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      continue-on-error: true
      with:
        path: /tmp/supabase-images.tar.zst
        key: ${{ steps.images.outputs.cache-primary-key }}

    # The same kind of keys production uses: publishable and secret, not the legacy JWT keys.
    - name: Write .env.local from the local Supabase instance
      shell: bash
      run: |
        STATUS=$(supabase status -o json)
        echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)" >> .env.local
        echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(echo "$STATUS" | jq -r .PUBLISHABLE_KEY)" >> .env.local
        echo "SUPABASE_SECRET_KEY=$(echo "$STATUS" | jq -r .SECRET_KEY)" >> .env.local

# Weekly version-update PRs. Security updates are enabled separately in the repo settings.
# Every PR still needs a passing CI run and the owner's review (the main ruleset).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # These must move together.
      next:
        patterns: ['next', 'eslint-config-next', '@next/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      supabase:
        patterns: ['@supabase/*']
      # Everything else that's a patch or minor, in one PR.
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # The app runs on Node 22 (.nvmrc, CI and Vercel). Newer Node types would let code compile
      # against APIs that don't exist at runtime; move this with .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint (through eslint-config-next) throws "typescript-eslint does not support
      # TS 7.0" and its peer range is typescript <6.1.0, so 6.x is still offered. Drop this once
      # it supports TS 7.
      - dependency-name: typescript
        versions: ['>=7']
      # eslint-config-next 16.3's plugins don't run on ESLint 10: eslint-plugin-react fails with
      # "contextOrFilename.getFilename is not a function", and it, eslint-plugin-import and
      # eslint-plugin-jsx-a11y only declare eslint ^9 peers. Drop this once they support 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
  # The workflows, plus the composite action under .github/actions. One PR a week for all of them,
  # each one a CI run.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

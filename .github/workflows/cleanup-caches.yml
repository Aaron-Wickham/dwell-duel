name: Clean up PR caches

# A cache saved on a PR is scoped to that PR and is of no use once it closes, but it counts
# against the repository's 10 GB limit until GitHub evicts it (#277).
on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  delete:
    # A fork PR's token is read-only, so it couldn't delete anything.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete this PR's caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          # --limit 100 caps one listing, so go round until none are left.
          while ids=$(gh cache list --repo "$REPO" --ref "$REF" --limit 100 --json id --jq '.[].id') && [ -n "$ids" ]; do
            for id in $ids; do gh cache delete "$id" --repo "$REPO"; done
          done

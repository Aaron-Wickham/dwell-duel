name: Closing alerts

# A backup for pg_cron's closing-alerts job (0064, #189), which is the real timer (every minute): GitHub
# runs a */10 schedule on a best-effort basis and dropped most of its runs. It only calls the app;
# the app decides who hears what, once per market, so the two callers never repeat a push. Each
# successful call is recorded, and the Admin pages warn when none has landed for 30 minutes (#149).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the closing-alerts route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # The deployed app's origin, e.g. https://www.dwellduel.com, as a repository variable
          # (Settings > Secrets and variables > Actions > Variables).
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::The CRON_SECRET repository secret is not set, so the backup can't call the app."
            exit 1
          fi
          if [ -z "$APP_URL" ]; then
            echo "::error::The APP_URL repository variable is not set, so there is no app to call."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/closing-alerts"

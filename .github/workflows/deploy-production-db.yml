name: Deploy Production Database

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  # Also runnable by hand on any branch.
  workflow_dispatch:

permissions:
  contents: read

# Two pushes must never overlap, and a queued one must never cancel one that's mid-migration.
concurrency:
  group: prod-db
  cancel-in-progress: false

jobs:
  # A dry run first: a migration that can't apply fails here, before anything is pushed. Migrations
  # apply on merge with no approval step (Aaron's call, #138); CI has already run every one against
  # a local database, and a push takes well under the minutes a Vercel build does, so the database
  # is normally ready before the app that needs it goes live.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The same version as ci.yml; 2.117.0 is the first release that accepts fine-grained sbp_v0_ tokens.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --project-ref lymrpiivqvdnfcjmxksx --dry-run

  push-migrations:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Push migrations to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --project-ref lymrpiivqvdnfcjmxksx

name: Deploy Production

# Every push to main deploys through here, not through Vercel's Git integration (vercel.json turns
# that off for main): pending migrations first, then the app through a Vercel deploy hook. So new
# code never goes live before the functions and tables it calls (#148).
#
# It runs only from main, and its secrets live in the Production environment, which only main may
# deploy to (#291). What to migrate is decided from production's own migration history, not from
# this push's diff, so a migration an earlier run failed to apply is picked up by the next (#249).
on:
  push:
    branches: [main]
  # Also runnable by hand from main: pushes any pending migrations, then redeploys.
  workflow_dispatch:

permissions:
  contents: read

# Two runs must never overlap, and a queued one must never cancel one that's mid-migration.
# `queue: max` keeps every waiting run instead of replacing the pending one with the newest.
concurrency:
  group: prod-db
  cancel-in-progress: false
  queue: max

jobs:
  # A dry run against production: lists what's pending, and a migration that can't apply fails
  # here, before anything is pushed. Migrations apply on merge with no approval step (Aaron's call,
  # #138); CI has already run every one against a local database.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy Production runs only from main, not $GITHUB_REF."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The same version as ci.yml; 2.117.0 is the first release that accepts fine-grained sbp_v0_ tokens.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.117.0

      - name: Dry run
        id: plan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          PLAN=$(supabase db push --project-ref lymrpiivqvdnfcjmxksx --dry-run --output-format json --agent no)
          COUNT=$(echo "$PLAN" | jq '.migrations | length')
          if [ "$COUNT" -gt 0 ]; then
            echo "Pending migrations:"
            echo "$PLAN" | jq -r '.migrations[] | " • \(.)"'
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "Production is up to date; nothing to migrate."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

  push-migrations:
    needs: plan
    if: needs.plan.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy Production runs only from main, not $GITHUB_REF."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.117.0

      - name: Install age
        run: sudo apt-get install -y --no-install-recommends age

      # A restore point from moments before the migration, the same dump as the nightly backup
      # (#248). If it fails, nothing is migrated and the old app stays live.
      - name: Back up the database before migrating
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          # GitHub's own registry, for the CLI's pg_dump image: no anonymous pull limit from Actions.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          SEALED=$(scripts/backup/backup.sh db "pre-migration-${GITHUB_SHA::7}" "$RUNNER_TEMP/backup")
          mapfile -t FILES <<<"$SEALED"
          scripts/backup/backup.sh push db "${FILES[@]}"

      - name: Push migrations to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --project-ref lymrpiivqvdnfcjmxksx

  # Runs straight after the plan when nothing is pending, and only after a successful push when
  # something was; a failed backup or migration fails the run and leaves the old app live.
  deploy-app:
    needs: [plan, push-migrations]
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      (needs.push-migrations.result == 'success' ||
       (needs.plan.outputs.pending == 'false' && needs.push-migrations.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy Production runs only from main, not $GITHUB_REF."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # The hook builds main's HEAD, not this run's commit (#208). If main has moved on, the push
      # that moved it has its own run queued behind this one in the prod-db group, and that run
      # deploys once its own migrations are in; firing the hook now would build the newer code
      # before them.
      - name: Is this commit still main's head?
        id: head
        run: |
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on from $GITHUB_SHA to $head; that push's own run deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the Vercel production deploy
        if: steps.head.outputs.current == 'true'
        id: hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::The VERCEL_DEPLOY_HOOK_URL secret is not set in the Production environment, so nothing was deployed."
            exit 1
          fi
          SINCE=$(date +%s000)
          RESPONSE=$(curl --fail --silent --show-error --max-time 30 -X POST "$VERCEL_DEPLOY_HOOK_URL")
          echo "Vercel accepted the hook (job $(echo "$RESPONSE" | jq -r '.job.id // "unknown"')) and is building $GITHUB_SHA."
          echo "since=$(echo "$RESPONSE" | jq -r --arg since "$SINCE" '.job.createdAt // $since')" >> "$GITHUB_OUTPUT"

      # Vercel accepting the hook says nothing about the build (#216): this watches the deployment
      # of this commit until it is live, and fails the run, and so notifies, when Vercel gives up on
      # it. Without a token there is nothing to watch with; Vercel's own email is then the only alert.
      # Nothing to watch either when main moved on and the hook didn't fire.
      - name: Wait for the Vercel build
        if: steps.hook.outcome == 'success' && steps.hook.outputs.since != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Only when the project belongs to a Vercel team rather than the token's own account.
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          SINCE: ${{ steps.hook.outputs.since }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::The VERCEL_TOKEN secret is not set in the Production environment, so this run can't watch the Vercel build; a failed build only reaches Vercel's own email."
            exit 0
          fi
          QUERY="app=dwell-duel&target=production&limit=10"
          if [ -n "$VERCEL_TEAM_ID" ]; then QUERY="$QUERY&teamId=$VERCEL_TEAM_ID"; fi
          DEADLINE=$((SECONDS + 15 * 60))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            DEPLOYMENT=$(curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?$QUERY" |
              jq -c --arg sha "$GITHUB_SHA" --argjson since "$SINCE" \
                '[.deployments[] | select(.createdAt >= $since and (.meta.githubCommitSha // $sha) == $sha)] | first // empty')
            STATE=$(echo "$DEPLOYMENT" | jq -r '.readyState // .state // empty')
            case "$STATE" in
              READY)
                echo "Live: https://$(echo "$DEPLOYMENT" | jq -r .url)"
                exit 0
                ;;
              ERROR | CANCELED)
                echo "::error::Vercel's production deploy of $GITHUB_SHA ended $STATE: https://$(echo "$DEPLOYMENT" | jq -r .url). The previous deploy is still live."
                exit 1
                ;;
              '')
                echo "Waiting for Vercel to list the deployment of $GITHUB_SHA..."
                ;;
              *)
                echo "Vercel: $STATE"
                ;;
            esac
            sleep 20
          done
          echo "::error::Vercel's deploy of $GITHUB_SHA was still not live after 15 minutes."
          exit 1

name: Deploy Production

# Every push to main deploys through here, not through Vercel's Git integration (vercel.json turns
# that off for main): migrations first, when there are any, then the app through a Vercel deploy
# hook. So new code never goes live before the functions and tables it calls (#148).
on:
  push:
    branches: [main]
  # Also runnable by hand from main: pushes any pending migrations, then redeploys.
  workflow_dispatch:

permissions:
  contents: read

# Two runs must never overlap, and a queued one must never cancel one that's mid-migration.
concurrency:
  group: prod-db
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A push whose previous commit is unknown (a new branch, a force push) or a manual run
      # counts as having migrations: a push with nothing pending is a quick no-op.
      - name: Did this push change supabase/migrations?
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- supabase/migrations; then
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          fi

  # A dry run first: a migration that can't apply fails here, before anything is pushed. Migrations
  # apply on merge with no approval step (Aaron's call, #138); CI has already run every one against
  # a local database.
  plan:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The same version as ci.yml; 2.117.0 is the first release that accepts fine-grained sbp_v0_ tokens.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --project-ref lymrpiivqvdnfcjmxksx --dry-run

  push-migrations:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Push migrations to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --project-ref lymrpiivqvdnfcjmxksx

  # Runs straight away when nothing changed under supabase/migrations, and only after a successful
  # push when something did; a failed migration fails the run and leaves the old app live.
  deploy-app:
    needs: [changes, push-migrations]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.push-migrations.result == 'success' ||
       (needs.changes.outputs.migrations == 'false' && needs.push-migrations.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The hook builds main's HEAD, not this run's commit (#208). If main has moved on, the push
      # that moved it has its own run queued behind this one in the prod-db group, and that run
      # deploys once its own migrations are in; firing the hook now would build the newer code
      # before them.
      - name: Is this commit still main's head?
        id: head
        run: |
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on from $GITHUB_SHA to $head; that push's own run deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the Vercel production deploy
        if: steps.head.outputs.current == 'true'
        id: hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::The VERCEL_DEPLOY_HOOK_URL repository secret is not set, so nothing was deployed."
            exit 1
          fi
          SINCE=$(date +%s000)
          RESPONSE=$(curl --fail --silent --show-error --max-time 30 -X POST "$VERCEL_DEPLOY_HOOK_URL")
          echo "Vercel accepted the hook (job $(echo "$RESPONSE" | jq -r '.job.id // "unknown"')) and is building $GITHUB_SHA."
          echo "since=$(echo "$RESPONSE" | jq -r --arg since "$SINCE" '.job.createdAt // $since')" >> "$GITHUB_OUTPUT"

      # Vercel accepting the hook says nothing about the build (#216): this watches the deployment
      # of this commit until it is live, and fails the run, and so notifies, when Vercel gives up on
      # it. Without a token there is nothing to watch with; Vercel's own email is then the only alert.
      - name: Wait for the Vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Only when the project belongs to a Vercel team rather than the token's own account.
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          SINCE: ${{ steps.hook.outputs.since }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::The VERCEL_TOKEN repository secret is not set, so this run can't watch the Vercel build; a failed build only reaches Vercel's own email."
            exit 0
          fi
          QUERY="app=dwell-duel&target=production&limit=10"
          if [ -n "$VERCEL_TEAM_ID" ]; then QUERY="$QUERY&teamId=$VERCEL_TEAM_ID"; fi
          DEADLINE=$((SECONDS + 15 * 60))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            DEPLOYMENT=$(curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?$QUERY" |
              jq -c --arg sha "$GITHUB_SHA" --argjson since "$SINCE" \
                '[.deployments[] | select(.createdAt >= $since and (.meta.githubCommitSha // $sha) == $sha)] | first // empty')
            STATE=$(echo "$DEPLOYMENT" | jq -r '.readyState // .state // empty')
            case "$STATE" in
              READY)
                echo "Live: https://$(echo "$DEPLOYMENT" | jq -r .url)"
                exit 0
                ;;
              ERROR | CANCELED)
                echo "::error::Vercel's production deploy of $GITHUB_SHA ended $STATE: https://$(echo "$DEPLOYMENT" | jq -r .url). The previous deploy is still live."
                exit 1
                ;;
              '')
                echo "Waiting for Vercel to list the deployment of $GITHUB_SHA..."
                ;;
              *)
                echo "Vercel: $STATE"
                ;;
            esac
            sleep 20
          done
          echo "::error::Vercel's deploy of $GITHUB_SHA was still not live after 15 minutes."
          exit 1

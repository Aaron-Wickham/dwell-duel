name: Lighthouse

# Lab numbers for the public pages, beside Speed Insights' field data (#456). Its own workflow, not
# a job in ci.yml, so it never feeds `ci-ok`: every budget in lighthouserc.json only warns, and the
# reports are an artifact to read, not a gate.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The sign-in and privacy pages never call Supabase without a session, so the build needs only
    # the two public variables, pointed at nothing; the key is a placeholder, not a credential.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_lighthouse_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Restore only, the same key as ci.yml's (#277); warm-caches.yml saves it on main.
      - name: Restore the Next.js build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            next-${{ runner.os }}-

      - run: npm run build

      # Starts the production server itself (lighthouserc.json), with the runner's own Chrome.
      - run: npx --yes @lhci/cli@0.15.1 autorun

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
